name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path
          swiftc --version | head -1
          cmake --version | head -1
          rustc --version

      - name: Fetch pinned frameworks
        run: python3 scripts/fetch_toolchain.py

      - name: Add Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Build unsigned IPA
        run: python3 scripts/build.py --sdk-root LocalSDKs/iPhoneOS26.0.sdk

      - name: Show artifacts
        run: ls -lh build/*.ipa

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ci-${{ github.run_number }}"
          gh release create "$TAG" build/*.ipa --title "Dylix CI $TAG" --notes "Automated build" --repo "${{ github.repository }}" || gh release upload "$TAG" build/*.ipa --clobber --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Dylix-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
